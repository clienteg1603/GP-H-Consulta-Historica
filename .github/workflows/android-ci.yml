name: Android CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'android_app/**'
      - '.github/workflows/android-ci.yml'
  push:
    branches:
      - 'android-*'
    paths:
      - 'android_app/**'
      - '.github/workflows/android-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preparar projeto Android
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/gph_android_ci
          flutter create \
            --platforms=android \
            --org br.com.gph \
            --project-name gph_consulta_android \
            /tmp/gph_android_ci
          cp android_app/pubspec.yaml /tmp/gph_android_ci/pubspec.yaml
          rm -rf /tmp/gph_android_ci/lib /tmp/gph_android_ci/test /tmp/gph_android_ci/assets
          cp -R android_app/lib /tmp/gph_android_ci/lib
          cp -R android_app/test /tmp/gph_android_ci/test
          if [ -d android_app/assets ]; then
            cp -R android_app/assets /tmp/gph_android_ci/assets
          fi

          python - <<'PY'
          from pathlib import Path

          root = Path('/tmp/gph_android_ci')
          manifest = root / 'android/app/src/main/AndroidManifest.xml'
          text = manifest.read_text(encoding='utf-8')
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = [
              'android.permission.INTERNET',
              'android.permission.POST_NOTIFICATIONS',
          ]
          for permission in permissions:
              if permission not in text:
                  text = text.replace(
                      marker,
                      marker + f'\n    <uses-permission android:name="{permission}" />',
                      1,
                  )
          manifest.write_text(text, encoding='utf-8')

          gradle = root / 'android/app/build.gradle.kts'
          source = gradle.read_text(encoding='utf-8')
          compile_marker = '    compileOptions {\n'
          if 'isCoreLibraryDesugaringEnabled = true' not in source:
              if compile_marker not in source:
                  raise SystemExit('Bloco compileOptions não localizado no template Flutter.')
              source = source.replace(
                  compile_marker,
                  compile_marker + '        isCoreLibraryDesugaringEnabled = true\n',
                  1,
              )
          if 'coreLibraryDesugaring(' not in source:
              source += '''\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'''
          gradle.write_text(source, encoding='utf-8')
          PY

      - name: Dependências
        working-directory: /tmp/gph_android_ci
        run: flutter pub get

      - name: Análise
        working-directory: /tmp/gph_android_ci
        run: flutter analyze

      - name: Testes
        working-directory: /tmp/gph_android_ci
        run: flutter test

      - name: Compilar APK debug ARM64
        working-directory: /tmp/gph_android_ci
        run: flutter build apk --debug --target-platform android-arm64
