name: Actions storage maintenance

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '17 8 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/scripts/actions_storage.cjs'
      - '.github/scripts/check_actions_storage.py'
      - '.github/actions-storage-request.json'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/scripts/actions_storage.cjs'
      - '.github/scripts/check_actions_storage.py'

permissions:
  contents: read

concurrency:
  group: actions-storage-maintenance
  cancel-in-progress: false

jobs:
  policy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install YAML parser without a persistent cache
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.2
      - name: Enforce explicit temporary artifact retention
        run: python3 .github/scripts/check_actions_storage.py

  storage:
    needs: policy
    if: >-
      always() && github.event_name != 'pull_request' &&
      (needs.policy.result == 'success' || needs.policy.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Remove reviewed temporary outputs after retention
        uses: actions/github-script@v9
        with:
          script: |
            const {maintain} = require('./.github/scripts/actions_storage.cjs');
            await maintain({github, context, core});
