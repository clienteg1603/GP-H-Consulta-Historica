<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>GP-H — Administração de comentários</title>
  <style>
    :root{color-scheme:dark;--bg:#07101d;--card:#0d1726;--text:#eef4ff;--muted:#9fb0c5;--accent:#3b82f6;--accent2:#60a5fa;--border:#1c2b41;--ok:#86efac;--err:#fca5a5}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at top,#10223d 0,#07101d 45%,#050b14 100%);color:var(--text);min-height:100vh}.wrap{width:min(900px,calc(100% - 32px));margin:auto;padding:38px 0 60px}h1{margin:0 0 8px;font-size:clamp(1.8rem,4vw,2.7rem)}.sub{margin:0 0 24px;color:var(--muted)}.panel,.comment{background:rgba(13,23,38,.94);border:1px solid var(--border);border-radius:16px;padding:18px}.panel{margin-bottom:22px}.login{display:grid;grid-template-columns:1fr auto;gap:10px}.field,textarea{width:100%;border:1px solid #2a3d59;background:#08121f;color:var(--text);border-radius:11px;padding:12px 13px;font:inherit;outline:none}.field:focus,textarea:focus{border-color:#4f86cf;box-shadow:0 0 0 3px rgba(59,130,246,.12)}.btn{border:0;border-radius:11px;padding:12px 16px;font:inherit;font-weight:800;cursor:pointer;background:linear-gradient(180deg,var(--accent2),var(--accent));color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}.secondary{background:#101c2c;border:1px solid #2a3d59}.status{min-height:23px;margin-top:10px;color:var(--muted)}.status.ok{color:var(--ok)}.status.err{color:var(--err)}#comments{display:grid;gap:14px}.head{display:flex;justify-content:space-between;gap:15px;align-items:start}.name{font-weight:850}.date{font-size:.84rem;color:#7890ad}.message{white-space:pre-wrap;color:#c7d5e7;margin:8px 0 14px}.existing{padding:10px 12px;background:#0d1b2d;border-left:3px solid var(--accent2);border-radius:0 9px 9px 0;margin-bottom:12px}.existing strong{display:block;color:#93c5fd;font-size:.83rem;margin-bottom:3px}.reply-row{display:grid;gap:9px}.reply-row textarea{min-height:92px;resize:vertical}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.small-status{color:var(--muted);font-size:.9rem}.empty{color:var(--muted);padding:20px;text-align:center;border:1px dashed #38506f;border-radius:12px}a{color:#93c5fd}@media(max-width:640px){.login{grid-template-columns:1fr}.head{display:block}.date{display:block;margin-top:3px}}
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Comentários do GP-H</h1>
    <p class="sub">Área privada para responder aos comentários publicados no site.</p>

    <section class="panel" id="login-panel">
      <div class="login">
        <input class="field" id="admin-key" type="password" autocomplete="current-password" placeholder="Chave de administrador">
        <button class="btn" id="login-btn">Entrar</button>
      </div>
      <div class="status" id="login-status"></div>
    </section>

    <section id="admin-area" hidden>
      <div class="actions" style="margin-bottom:14px">
        <button class="btn secondary" id="refresh-btn">Atualizar comentários</button>
        <button class="btn secondary" id="logout-btn">Sair</button>
        <a href="./" target="_blank" rel="noopener">Abrir site público</a>
      </div>
      <div id="comments"></div>
    </section>
  </main>

  <script src="comments-config.js"></script>
  <script>
    (() => {
      const cfg = window.GPH_COMMENTS || {};
      const keyInput = document.getElementById('admin-key');
      const loginBtn = document.getElementById('login-btn');
      const loginStatus = document.getElementById('login-status');
      const loginPanel = document.getElementById('login-panel');
      const adminArea = document.getElementById('admin-area');
      const commentsEl = document.getElementById('comments');
      const refreshBtn = document.getElementById('refresh-btn');
      const logoutBtn = document.getElementById('logout-btn');
      const headers = {'Content-Type':'application/json',...(cfg.publicHeaders||{})};
      let adminKey = sessionStorage.getItem('gph_admin_key') || '';

      const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const fmt = (v) => { try { return new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'short'}).format(new Date(v)); } catch { return ''; } };

      async function api(payload){
        const r = await fetch(cfg.submitUrl,{method:'POST',headers,body:JSON.stringify(payload)});
        const data = await r.json().catch(()=>({}));
        if(!r.ok) throw new Error(data.error || 'Falha na operação.');
        return data;
      }

      async function checkKey(key){
        return api({action:'admin_check',admin_key:key});
      }

      async function loadComments(){
        commentsEl.innerHTML='<div class="empty">Carregando comentários...</div>';
        try{
          const r=await fetch(cfg.listUrl,{headers:cfg.publicHeaders||{}});
          if(!r.ok) throw new Error('Falha ao carregar comentários.');
          const data=await r.json();
          const rows=data.comments||[];
          if(!rows.length){commentsEl.innerHTML='<div class="empty">Nenhum comentário publicado ainda.</div>';return;}
          commentsEl.innerHTML=rows.map(x=>{
            const current=x.admin_reply||'';
            const existing=current?`<div class="existing"><strong>Resposta atual do GP-H</strong>${esc(current)}</div>`:'';
            return `<article class="comment" data-id="${x.id}"><div class="head"><span class="name">${esc(x.name)}</span><span class="date">${esc(fmt(x.created_at))}</span></div><div class="message">${esc(x.message)}</div>${existing}<div class="reply-row"><textarea maxlength="1500" placeholder="Escreva a resposta que aparecerá publicamente no site">${esc(current)}</textarea><div class="actions"><button class="btn save-reply">${current?'Atualizar resposta':'Publicar resposta'}</button><span class="small-status"></span></div></div></article>`;
          }).join('');
          document.querySelectorAll('.save-reply').forEach(btn=>btn.addEventListener('click',saveReply));
        }catch(e){commentsEl.innerHTML=`<div class="empty">${esc(e.message)}</div>`;}
      }

      async function saveReply(ev){
        const card=ev.currentTarget.closest('.comment');
        const textarea=card.querySelector('textarea');
        const st=card.querySelector('.small-status');
        const btn=ev.currentTarget;
        const reply=textarea.value.trim();
        if(reply.length<2){st.textContent='Escreva uma resposta.';return;}
        btn.disabled=true;st.textContent='Salvando...';
        try{
          await api({action:'admin_reply',admin_key:adminKey,comment_id:Number(card.dataset.id),reply});
          st.textContent='Resposta publicada.';
          await loadComments();
        }catch(e){st.textContent=e.message;}
        finally{btn.disabled=false;}
      }

      async function login(){
        const key=keyInput.value.trim();
        if(!key){loginStatus.className='status err';loginStatus.textContent='Digite a chave de administrador.';return;}
        loginBtn.disabled=true;loginStatus.className='status';loginStatus.textContent='Verificando...';
        try{
          await checkKey(key);adminKey=key;sessionStorage.setItem('gph_admin_key',key);loginPanel.hidden=true;adminArea.hidden=false;await loadComments();
        }catch(e){loginStatus.className='status err';loginStatus.textContent=e.message;}
        finally{loginBtn.disabled=false;}
      }

      loginBtn.addEventListener('click',login);
      keyInput.addEventListener('keydown',e=>{if(e.key==='Enter')login();});
      refreshBtn.addEventListener('click',loadComments);
      logoutBtn.addEventListener('click',()=>{sessionStorage.removeItem('gph_admin_key');adminKey='';adminArea.hidden=true;loginPanel.hidden=false;keyInput.value='';loginStatus.textContent='';});

      if(adminKey){keyInput.value=adminKey;login();}
    })();
  </script>
</body>
</html>
